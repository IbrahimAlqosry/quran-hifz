name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build unsigned AAB
        run: gradle -p android bundleRelease --no-daemon --stacktrace
      - name: Publish build to android-build branch
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/bundle/release/*.aab /tmp/out/app-release-unsigned.aab
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan android-build
          git rm -rf . > /dev/null
          cp /tmp/out/*.aab .
          echo "Built from ${GITHUB_SHA}" > BUILD_INFO.txt
          git add -A && git commit -m "Unsigned AAB from ${GITHUB_SHA}"
          git push -f origin android-build
